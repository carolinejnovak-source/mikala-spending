<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Mikala Spending — Errors</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0f0f1a; color: #e0e0f0; font-family: 'Segoe UI', sans-serif; padding: 32px 20px; }
    .container { max-width: 700px; margin: 0 auto; }
    h1 { color: #c9b8ff; margin-bottom: 24px; }
    .error-row { background: #1a1a2e; border: 1px solid #2a2a4a; border-radius: 10px; padding: 14px 18px; margin-bottom: 10px; }
    .time { color: #666; font-size: 0.8rem; margin-bottom: 4px; }
    .msg { font-size: 0.9rem; color: #ff8a8a; }
    .empty { color: #666; }
    a { color: #7c5fe6; text-decoration: none; }
  </style>
</head>
<body>
<div class="container">
  <h1>🌙 Error Log</h1>
  <p style="margin-bottom:20px;"><a href="/">← Back</a></p>
  {% if errors %}
    {% for e in errors %}
    <div class="error-row">
      <div class="time">{{ e.time }}</div>
      <div class="msg">{{ e.error }}</div>
    </div>
    {% endfor %}
  {% else %}
    <div class="empty">No errors logged. All good! ✅</div>
  {% endif %}
</div>
</body>
</html>
