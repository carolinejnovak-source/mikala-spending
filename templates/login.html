<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mikala Spending — Login</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0f0f1a; color: #e0e0f0; font-family: 'Segoe UI', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .card { background: #1a1a2e; border: 1px solid #2a2a4a; border-radius: 16px; padding: 48px 40px; width: 100%; max-width: 380px; text-align: center; }
    .emoji { font-size: 2.5rem; margin-bottom: 12px; }
    h1 { font-size: 1.4rem; font-weight: 600; color: #c9b8ff; margin-bottom: 8px; }
    p { color: #888; font-size: 0.9rem; margin-bottom: 28px; }
    input { width: 100%; padding: 12px 16px; background: #12122a; border: 1px solid #333; border-radius: 10px; color: #e0e0f0; font-size: 0.95rem; margin-bottom: 14px; }
    input:focus { outline: none; border-color: #7c5fe6; }
    button { width: 100%; padding: 13px; background: #7c5fe6; border: none; border-radius: 10px; color: white; font-size: 1rem; font-weight: 600; cursor: pointer; }
    button:hover { background: #9b7cf8; }
    .error { color: #ff6b6b; font-size: 0.85rem; margin-bottom: 14px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="emoji">🌙</div>
    <h1>Mikala Spending</h1>
    <p>Monthly cost tracker</p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="POST">
      <input type="text" name="username" placeholder="Username" required>
      <input type="password" name="password" placeholder="Password" required>
      <button type="submit">Sign In</button>
    </form>
  </div>
</body>
</html>
